spring:
  datasource:
    url: jdbc:mysql://localhost:3307/commerce
    username: root
    password: <LOCAL_DB_ROOT_PASSWORD>
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

jwt:
  secret: <LOCAL_JWT_SECRET>
  expiration: 3600000

portone:
  api-secret: <LOCAL_PORTONE_API_SECRET>
